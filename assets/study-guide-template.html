<!DOCTYPE html>
<!-- ==================================================================
     LONG DOCUMENT TEMPLATE · parchment design system
     多页 A4 白皮书/技术报告/年度总结
     结构：封面 -> 目录 -> 执行摘要 -> 正文章节 -> 附录
     ================================================================== -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{DOC_TITLE}}</title>
<meta name="author" content="{{AUTHOR}}">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="keywords" content="{{KEYWORDS}}">
<meta name="generator" content="Kami">
<style>
  /* Regular weight */
  @font-face {
    font-family: "TsangerJinKai02";
    src: local("Songti SC"), local("STSong");
    font-weight: 400;
    font-style: normal;
  }

  /* Bold weight - W05 for all bold variants */
  @font-face {
    font-family: "TsangerJinKai02";
    src: local("Songti SC"), local("STSong");
    font-weight: 500;
    font-style: normal;
  }

  @page {
    size: A4;
    margin: 20mm 22mm 22mm 22mm;
    background: #f5f4ed;

    @top-right {
      content: string(section-title);
      font-family: "TsangerJinKai02", "Source Han Serif SC",
                   "Noto Serif CJK SC", "Songti SC", Georgia, serif;
      font-size: 8pt;
      color: #6b6a64;
    }

    @bottom-center {
      content: counter(page) "  ·  {{FOOTER_TITLE_CSS}}";
      font-family: "TsangerJinKai02", "Source Han Serif SC",
                   "Noto Serif CJK SC", "Songti SC", Georgia, serif;
      font-size: 9pt;
      color: #6b6a64;
    }
  }

  @page:first {
    @top-right { content: ""; }
    @bottom-center { content: ""; }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --parchment: #f5f4ed;
    --ivory:     #faf9f5;
    --near-black:#141413;
    --dark-warm: #3d3d3a;
    --olive:     #504e49;
    --stone:     #6b6a64;
    --brand:     #1B365D;
    --border:    #e8e6dc;
    --border-soft:#e5e3d8;
    --tag-bg:    #E4ECF5;
    --serif: "TsangerJinKai02", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", Georgia, serif;
    --sans: var(--serif);

    --rhythm-module:  14pt;
    --rhythm-section: 18pt;
  }

  html, body { background: var(--parchment); }

  @media screen {
    body { max-width: 210mm; margin: 0 auto; padding: 20mm 22mm 22mm 22mm; }
  }

  body {
    color: var(--near-black);
    font-family: var(--serif);
    font-size: 10.5pt;
    line-height: 1.55;
    letter-spacing: 0.3pt;
    widows: 3;
    orphans: 3;
  }

  .sans {
    font-family: var(--sans);
  }

  /* ========== COVER ========== */
  .cover {
    min-height: 240mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40mm 0 0 0;
    break-after: page;
  }
  .cover-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8pt;
    font-family: var(--sans);
    font-size: 10pt;
    color: var(--brand);
    letter-spacing: 1.5pt;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 18pt;
  }
  .cover-eyebrow::before {
    content: "";
    width: 9pt;
    height: 1.5pt;
    border-radius: 0.75pt;
    background: var(--brand);
    flex-shrink: 0;
  }
  .cover-title {
    font-size: 36pt;
    font-weight: 500;
    color: var(--near-black);
    line-height: 1.15;
    letter-spacing: 0.3pt;
    margin-bottom: 16pt;
  }
  .cover-sub {
    font-family: var(--sans);
    font-size: 14pt;
    color: var(--olive);
    line-height: 1.5;
    max-width: 85%;
    margin-bottom: 30pt;
  }
  .cover-meta {
    font-family: var(--sans);
    font-size: 10pt;
    color: var(--stone);
    line-height: 1.5;
  }
  .cover-meta strong {
    color: var(--dark-warm);
    font-weight: 500;
  }

  /* ========== TOC（目录）========== */
  .toc { break-after: page; }
  .toc h2 {
    font-size: 22pt;
    font-weight: 500;
    margin-bottom: var(--rhythm-module);
    border-left: 2.5pt solid var(--brand);
    border-radius: 1.5pt;
    padding-left: 8pt;
  }
  .toc-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6pt 0;
    border-bottom: 0.3pt dotted var(--border);
    font-size: 11pt;
  }
  .toc-item:last-of-type { border-bottom: none; }
  .toc-num {
    color: var(--brand);
    font-weight: 500;
    min-width: 30pt;
  }
  .toc-title {
    flex: 1;
    color: var(--near-black);
    padding-left: 6pt;
    text-decoration: none;
    display: flex;
    justify-content: space-between;
    gap: 12pt;
  }
  .toc-title[href]::after {
    content: target-counter(attr(href), page);
    color: var(--stone);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
  }

  /* ========== HEADINGS ========== */
  h1 {
    font-size: 22pt;
    font-weight: 500;
    line-height: 1.2;
    margin: 0 0 10pt 0;
    border-left: 2.5pt solid var(--brand);
    border-radius: 1.5pt;
    padding-left: 8pt;
    color: var(--near-black);
    break-after: avoid;
    string-set: section-title content();
  }

  .running-title { string-set: section-title content(); }

  h2 {
    font-size: 16pt;
    font-weight: 500;
    line-height: 1.25;
    margin: 24pt 0 8pt 0;
    color: var(--near-black);
    break-after: avoid;
  }

  h3 {
    font-size: 13pt;
    font-weight: 500;
    line-height: 1.3;
    margin: 18pt 0 6pt 0;
    color: var(--dark-warm);
    break-after: avoid;
  }

  .chapter-num {
    font-family: var(--sans);
    font-size: 10pt;
    color: var(--brand);
    letter-spacing: 1pt;
    text-transform: uppercase;
    margin-bottom: 6pt;
  }

  /* ========== PARAGRAPHS ========== */
  p {
    margin: 0 0 10pt 0;
    line-height: 1.55;
    color: var(--near-black);
    widows: 2;
    orphans: 2;
  }

  .lead {
    font-size: 12pt;
    line-height: 1.55;
    color: var(--dark-warm);
    margin-bottom: var(--rhythm-module);
  }

  .hl { color: var(--brand); font-weight: 500; }
  strong { font-weight: 500; }

  /* ========== LISTS ========== */
  ul, ol {
    margin: 6pt 0 10pt 0;
    padding-left: 20pt;
    line-height: 1.55;
  }
  ul li::marker { color: var(--brand); }
  ol li::marker { color: var(--brand); font-weight: 500; }

  /* ========== QUOTE ========== */
  blockquote, .quote {
    border-left: 2pt solid var(--brand);
    margin: 12pt 0;
    padding: 4pt 0 4pt 16pt;
    color: var(--olive);
    line-height: 1.55;
    break-inside: avoid;
  }
  blockquote .cite, .quote .cite {
    display: block;
    font-size: 9pt;
    color: var(--stone);
    margin-top: 4pt;
  }

  /* ========== CODE ========== */
  /* Mono first for English glyphs, then CJK fallback so Chinese comments
     inside code/pre render correctly. A mono-only chain causes missing
     glyphs rendered as "?" or missing-glyph boxes in WeasyPrint when the system lacks
     a mono font with CJK coverage. */
  code {
    font-family: "JetBrains Mono", "SF Mono", Consolas,
                 "TsangerJinKai02", "Source Han Serif SC",
                 "Noto Serif CJK SC", "Songti SC", monospace;
    font-size: 9pt;
    background: var(--ivory);
    padding: 1pt 4pt;
    border-radius: 2pt;
    color: var(--dark-warm);
  }
  pre {
    font-family: "JetBrains Mono", "SF Mono", Consolas,
                 "TsangerJinKai02", "Source Han Serif SC",
                 "Noto Serif CJK SC", "Songti SC", monospace;
    font-size: 9pt;
    line-height: 1.5;
    background: var(--ivory);
    border-radius: 4pt;
    padding: 10pt 14pt;
    margin: 10pt 0;
    white-space: pre-wrap;
    color: var(--near-black);
    break-inside: avoid;
  }
  pre code { background: transparent; padding: 0; font-size: inherit; }

  /* ========== TABLE (kami-table) ========== */
  table, .kami-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 9.5pt;
    margin: 12pt 0;
    break-inside: avoid;
  }
  table th, .kami-table th {
    text-align: left;
    font-weight: 500;
    color: var(--dark-warm);
    padding: 6pt 8pt;
    border-bottom: 1pt solid var(--border);
    background: transparent;
  }
  table td, .kami-table td {
    padding: 5pt 8pt;
    border-bottom: 0.3pt solid var(--border-soft);
    vertical-align: top;
  }
  table.compact th, .kami-table.compact th { padding: 3pt 6pt; font-size: 8pt; }
  table.compact td, .kami-table.compact td { padding: 2pt 6pt; font-size: 8pt; line-height: 1.4; }
  table.financial td:not(:first-child), .kami-table.financial td:not(:first-child) {
    text-align: right; font-variant-numeric: tabular-nums;
  }
  table.financial th:not(:first-child), .kami-table.financial th:not(:first-child) { text-align: right; }
  table.striped tbody tr:nth-child(even) td, .kami-table.striped tbody tr:nth-child(even) td {
    background: var(--ivory);
  }
  table .total td, .kami-table .total td {
    font-weight: 500; border-top: 1pt solid var(--brand); border-bottom: none; color: var(--near-black);
  }

  /* ========== CALLOUT ========== */
  .callout {
    background: var(--ivory);
    border-left: 2pt solid var(--brand);
    padding: 10pt 14pt;
    border-radius: 3pt;
    margin: 12pt 0;
    line-height: 1.55;
    break-inside: avoid;
  }
  .callout blockquote,
  .callout .quote {
    border-left: none;
    padding-left: 0;
    margin: 6pt 0;
    color: var(--olive);
  }
  .callout blockquote:first-child,
  .callout .quote:first-child { margin-top: 0; }
  .callout blockquote:last-child,
  .callout .quote:last-child  { margin-bottom: 0; }

  .takeaway {
    background: var(--ivory);
    border-radius: 4pt;
    padding: 10pt 14pt;
    margin: 14pt 0;
    break-inside: avoid;
  }
  .takeaway-label {
    font-family: var(--sans);
    font-size: 9pt;
    color: var(--brand);
    letter-spacing: 0.5pt;
    text-transform: uppercase;
    margin-bottom: 4pt;
  }

  /* ========== TAG ========== */
  .tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--brand);
    font-family: var(--sans);
    font-size: 9pt;
    font-weight: 500;
    padding: 1pt 6pt;
    border-radius: 3pt;
    margin-right: 4pt;
  }

  /* ========== FIGURE ========== */
  figure {
    margin: 14pt 0;
    break-inside: avoid;
  }
  figure img {
    max-width: 100%;
    border-radius: 4pt;
  }
  /* Inline diagrams (e.g. a Mermaid-sourced SVG via scripts/mermaid_normalize.py):
     center and cap width so the figure never bleeds past the text column. */
  figure svg {
    display: block;
    margin: 0 auto;
    max-width: 78%;
    height: auto;
  }
  figcaption {
    font-family: var(--sans);
    font-size: 9pt;
    color: var(--stone);
    margin-top: 6pt;
    text-align: center;
  }

  /* ========== EXECUTIVE SUMMARY ========== */
  .exec-summary {
    background: var(--ivory);
    border-left: 1.4pt solid var(--brand);
    border-radius: 6pt;
    padding: 16pt 20pt;
    margin: 14pt 0;
    break-inside: avoid;
  }
  .exec-summary h2 {
    margin-top: 0;
    font-size: 13pt;
  }

  /* ========== CHAPTER BREAK ========== */
  .chapter { break-before: page; }
  .translation p { margin-bottom: 7pt; line-height: 1.5; }
  .translation .page-break { break-before: page; }
  .translation .para-label { color: var(--brand); font-weight: 500; }
  .source-note { color: var(--stone); font-size: 9pt; }
</style>
</head>
<body>
{{BODY_CONTENT}}
</body>
</html>
